<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orbit — Tasks</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/tasks.css">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">OR<span>BIT</span></div>
        
<div class="orbit-profile" id="orbitProfile" hidden>
    <img
        id="orbitProfilePicture"
        class="orbit-profile-picture"
        src=""
        alt="Profile picture"
        hidden
    >

    <div class="orbit-profile-details">
        <p id="orbitProfileName">Loading profile...</p>
        <span id="orbitProfileEmail"></span>
    </div>
</div>


        <nav class="nav">

            <a href="index.html"><span>⌂</span> Dashboard</a>

            <a href="mail.html"><span>✉</span> Mail</a>

            <a href="tasks.html" class="active">
                <span>✓</span> Tasks
            </a>

            <a href="schedule.html">
                <span>▣</span> Schedule
            </a>

            <a href="classroom.html">
                <span>▤</span> Classroom
            </a>

            <a href="for-you.html">
                <span>✦</span> For You
            </a>

            <a href="settings.html">
                <span>⚙</span> Settings
            </a>
            <a href="feedback.html"><span>✎</span> Feedback</a>
            
<button class="logout-btn" onclick="logoutOrbit()">
    ↪ Logout
</button>


        </nav>

    </aside>


    <main class="main">


<header class="header">
    <div>
        <span class="eyebrow">WORK</span>
        <h1>Tasks</h1>
        <p>Everything you need to get done.</p>
    </div>

    <button class="primary-btn" id="addTaskButton" type="button">
        + Add Task
    </button>
</header>

<section class="panel">

    <form id="taskForm" hidden>
        <h2>New Task</h2>

        <label for="taskTitle">Task title</label>
        <input id="taskTitle" type="text" maxlength="255"
               placeholder="e.g. Finish Python Assignment" required>

        <label for="taskDescription">Description</label>
        <textarea id="taskDescription"
                  placeholder="Add details (optional)"></textarea>

        <label for="taskDueDate">Due date and time</label>
        <input id="taskDueDate" type="datetime-local">

        <label for="taskPriority">Priority</label>
        <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <button class="primary-btn" type="submit">Save Task</button>
        <button type="button" id="cancelTaskButton">Cancel</button>

        <p id="taskFormMessage" role="status"></p>
    </form>

    <p id="taskStatus" role="status">Loading tasks...</p>

    <div class="task-section">
        <span class="eyebrow">TO DO</span>
        <div id="pendingTasks"></div>
    </div>

    <div class="task-section completed">
        <span class="eyebrow">COMPLETED</span>
        <div id="completedTasks"></div>
    </div>

</section>


    </main>

</div>
<script src="js/main.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
