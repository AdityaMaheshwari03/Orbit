<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit — Schedule</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/schedule.css">
</head>

<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">OR<span>BIT</span></div>

        <div class="orbit-profile" id="orbitProfile" hidden>
            <img id="orbitProfilePicture"
                 class="orbit-profile-picture"
                 src=""
                 alt="Profile picture"
                 hidden>
            <div class="orbit-profile-details">
                <p id="orbitProfileName">Loading profile...</p>
                <span id="orbitProfileEmail"></span>
            </div>
        </div>

        <nav class="nav">
            <a href="index.html"><span>⌂</span> Dashboard</a>
            <a href="mail.html"><span>✉</span> Mail</a>
            <a href="tasks.html"><span>✓</span> Tasks</a>
            <a href="schedule.html" class="active"><span>▣</span> Schedule</a>
            <a href="classroom.html"><span>▤</span> Classroom</a>
            <a href="for-you.html"><span>✦</span> For You</a>
            <a href="settings.html"><span>⚙</span> Settings</a>
            <a href="feedback.html"><span>✎</span> Feedback</a>

            <button class="logout-btn" onclick="logoutOrbit()">
                ↪ Logout
            </button>
        </nav>
    </aside>

    <main class="main">
        <header class="header">
            <div>
                <span class="eyebrow">CALENDAR</span>
                <h1>Schedule</h1>
                <p>Your classes, work and available time.</p>
            </div>

            <div class="schedule-actions">
                <button class="primary-btn" id="addEventButton" type="button">
                    + Add Event
                </button>
                <button class="secondary-btn" id="planDayButton" type="button">
                    ✦ Plan my day
                </button>
            </div>
        </header>

        <section class="schedule-container">
            <form id="eventForm" hidden>
                <h2>New Event</h2>

                <label for="eventTitle">Event title</label>
                <input id="eventTitle" type="text" maxlength="255"
                       placeholder="e.g. Python Programming" required>

                <label for="eventDescription">Description / Location</label>
                <textarea id="eventDescription"
                          placeholder="e.g. CS201 · Lab 3"></textarea>

                <label for="eventStart">Start date and time</label>
                <input id="eventStart" type="datetime-local" required>

                <label for="eventEnd">End date and time</label>
                <input id="eventEnd" type="datetime-local" required>

                <button class="primary-btn" type="submit">Save Event</button>
                <button class="secondary-btn" id="cancelEventButton" type="button">
                    Cancel
                </button>

                <p id="eventFormMessage" role="status"></p>
            </form>

            <div class="schedule-toolbar">
                <div class="day-header">
                    <strong id="scheduleDateHeading">Your Schedule</strong>
                    <span id="scheduleEventCount">Loading events...</span>
                </div>

                <div class="view-controls" aria-label="Calendar view">
                    <div class="view-toggle">
                        <button id="listViewButton"
                                class="view-btn active"
                                type="button"
                                aria-pressed="true">
                            List
                        </button>
                        <button id="weekViewButton"
                                class="view-btn"
                                type="button"
                                aria-pressed="false">
                            Week
                        </button>
                    </div>

                    <div id="weekNavigation" class="week-navigation" hidden>
                        <button id="previousWeekButton"
                                class="secondary-btn"
                                type="button"
                                aria-label="Previous week">‹</button>
                        <button id="todayButton"
                                class="secondary-btn"
                                type="button">Today</button>
                        <button id="nextWeekButton"
                                class="secondary-btn"
                                type="button"
                                aria-label="Next week">›</button>
                    </div>
                </div>
            </div>

            <p id="scheduleStatus" role="status" aria-live="polite"></p>

            <div id="scheduleEvents" class="schedule-events"></div>

            <div id="weekCalendar" class="week-calendar" hidden>
                <div id="weekGrid" class="week-grid"></div>
            </div>
        </section>
    </main>
</div>

<script src="js/main.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
